# Decap CMS configuration — the visual editor at /admin
#
# `git-gateway` lets you log in and publish without touching code. It works
# out-of-the-box on Netlify (Identity + Git Gateway). For other hosts, see GUIDE.md.

backend:
  name: git-gateway
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"


collections:
  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    description: "Add or edit a portfolio project. Fill both English and Hebrew."
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}} — {{category}} ({{year}})"
    sortable_fields: ["order", "year", "title"]
    fields:
      - { label: "Title (English)", name: "title", widget: "string" }
      - {
          label: "Title (Hebrew)",
          name: "title_he",
          widget: "string",
          required: false,
          hint: "Leave blank to reuse the English title (good for brand names).",
        }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Villas & Hotels"
          - "Wellness"
          - "Food & Beverage"
          - "Fashion"
          - "Lifestyle"
          - "Events"
          - "Retreats"
      - { label: "Year", name: "year", widget: "string" }
      - {
          label: "Location (English)",
          name: "location",
          widget: "string",
          required: false,
          hint: "e.g. Tulum, Mexico",
        }
      - {
          label: "Location (Hebrew)",
          name: "location_he",
          widget: "string",
          required: false,
          hint: "e.g. טולום, מקסיקו",
        }
      - {
          label: "Cover image",
          name: "cover",
          widget: "image",
          hint: "Shown on the work pages. Portrait images look best.",
        }
      - {
          label: "Feature this project",
          name: "featured",
          widget: "boolean",
          default: false,
          required: false,
        }
      - {
          label: "Order",
          name: "order",
          widget: "number",
          value_type: "int",
          required: false,
          hint: "Lower numbers appear first (1, 2, 3 …).",
        }
      - {
          label: "Description (English)",
          name: "description",
          widget: "text",
        }
      - {
          label: "Description (Hebrew)",
          name: "description_he",
          widget: "text",
          required: false,
        }
      - label: "Gallery images"
        name: "images"
        widget: "list"
        label_singular: "Image"
        summary: "{{fields.alt}}"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - {
              label: "Alt text",
              name: "alt",
              widget: "string",
              required: false,
              hint: "Brief description of the photo (for accessibility).",
            }

  - name: "videos"
    label: "Videos"
    label_singular: "Video"
    description: "Add or edit a video. Paste the Vimeo video ID (the number in the URL)."
    folder: "content/videos"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    summary: "{{title}}"
    sortable_fields: ["order", "title"]
    fields:
      - { label: "Title (English)", name: "title", widget: "string" }
      - {
          label: "Title (Hebrew)",
          name: "title_he",
          widget: "string",
          required: false,
        }
      - {
          label: "Vimeo ID",
          name: "vimeo_id",
          widget: "string",
          hint: "The number in the Vimeo URL. e.g. for vimeo.com/1239308942 enter 1239308942",
        }
      - {
          label: "Orientation",
          name: "orientation",
          widget: "select",
          options: ["vertical", "horizontal"],
          default: "vertical",
          hint: "Vertical = phone/story format. Horizontal = widescreen (takes two columns).",
        }
      - {
          label: "Description (English)",
          name: "description",
          widget: "text",
          required: false,
        }
      - {
          label: "Description (Hebrew)",
          name: "description_he",
          widget: "text",
          required: false,
        }
      - {
          label: "Order",
          name: "order",
          widget: "number",
          value_type: "int",
          required: false,
          hint: "Lower numbers appear first (1, 2, 3 …).",
        }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home / Hero"
        name: "home"
        file: "content/site/home.md"
        format: "yaml-frontmatter"
        fields:
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Tagline (English)", name: "tagline", widget: "string" }
          - {
              label: "Tagline (Hebrew)",
              name: "tagline_he",
              widget: "string",
              required: false,
            }
          - label: "Hero images (saved for future use)"
            name: "heroImages"
            widget: "list"
            required: false
            label_singular: "Image"
            fields:
              - { label: "Image", name: "src", widget: "image" }

      - label: "About"
        name: "about"
        file: "content/site/about.md"
        format: "yaml-frontmatter"
        fields:
          - { label: "Portrait", name: "portrait", widget: "image" }
          - { label: "Headline (English)", name: "headline", widget: "string" }
          - {
              label: "Headline (Hebrew)",
              name: "headline_he",
              widget: "string",
              required: false,
            }
          - {
              label: "Body (English)",
              name: "body",
              widget: "text",
              hint: "Separate paragraphs with a blank line.",
            }
          - {
              label: "Body (Hebrew)",
              name: "body_he",
              widget: "text",
              required: false,
              hint: "Separate paragraphs with a blank line.",
            }

      - label: "Contact"
        name: "contact"
        file: "content/site/contact.md"
        format: "yaml-frontmatter"
        fields:
          - {
              label: "WhatsApp number",
              name: "whatsapp",
              widget: "string",
              hint: "International format, digits only. e.g. 972509942030",
            }
          - {
              label: "Instagram handle",
              name: "instagram",
              widget: "string",
              hint: "Without the @. e.g. orilevi._",
            }
          - { label: "Background image", name: "background", widget: "image" }
