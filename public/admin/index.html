<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Ori Levi — Content Manager</title>
  </head>
  <body>
    <!-- Netlify Identity: handles login for the editor -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap CMS: the visual dashboard for adding & editing projects -->
    <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>

    <script>
      // After accepting an email invite, send the user straight into /admin.
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
